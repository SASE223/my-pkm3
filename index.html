<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hypomnema · 司辰手记</title>
    <style>
        :root {
            --bg: #1a1714;
            --surface: rgba(25,22,20,0.75);
            --surface2: rgba(15,13,11,0.65);
            --text: #d4cfc6;
            --text2: #a49e94;
            --text3: #746e66;
            --accent: #C9A961;
            --accent2: #E8C97A;
            --accent-light: rgba(201,169,97,0.12);
            --accent-glow: rgba(201,169,97,0.06);
            --border: rgba(201,169,97,0.25);
            --border-light: rgba(255,255,255,0.05);
            --shadow: 0 4px 24px rgba(0,0,0,0.45), 0 1px 4px rgba(201,169,97,0.04);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.55), 0 2px 12px rgba(201,169,97,0.06);
            --shadow-panel: 0 8px 32px rgba(0,0,0,0.5), 0 0 1px rgba(201,169,97,0.15);
            --radius: 2px;
            --radius-sm: 4px;
            --radius-xs: 2px;
            --font: 'Times New Roman', 'Songti SC', 'Noto Serif SC', serif;
            --font-mono: 'Courier New', monospace;
            --transition: 0.3s cubic-bezier(0.25,0.1,0.25,1);
            --sidebar-w: 360px;
            --header-h: 56px;
            --gantt-row-h: 38px;
            --frosted-glass: blur(14px) saturate(180%);
            --safe-top: env(safe-area-inset-top);
        }
        [data-theme="light"] {
            --bg: #eef2f5;
            --surface: rgba(245,242,238,0.82);
            --surface2: rgba(235,230,225,0.7);
            --text: #2c2a2a;
            --text2: #4a4242;
            --text3: #7a6e6a;
            --accent: #5F7F9E;
            --accent2: #8EA3B9;
            --accent-light: rgba(95,127,158,0.1);
            --accent-glow: rgba(95,127,158,0.04);
            --border: rgba(95,127,158,0.3);
            --border-light: rgba(95,127,158,0.1);
            --shadow: 0 4px 20px rgba(0,0,0,0.06), 0 1px 3px rgba(95,127,158,0.04);
            --shadow-lg: 0 14px 40px rgba(0,0,0,0.1), 0 2px 8px rgba(95,127,158,0.05);
            --shadow-panel: 0 8px 28px rgba(0,0,0,0.08), 0 0 1px rgba(95,127,158,0.12);
        }
        body::before { content:''; position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:-2; background:var(--bg); }
        body::after { content:''; position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:-1; opacity:0.7;
            background-image: repeating-linear-gradient(38deg, rgba(201,169,97,0.03) 0px, rgba(201,169,97,0.03) 1px, transparent 1px, transparent 6px), repeating-linear-gradient(-52deg, rgba(232,201,122,0.025) 0px, rgba(232,201,122,0.025) 1px, transparent 1px, transparent 9px), radial-gradient(circle at 18% 22%, rgba(201,169,97,0.06) 1px, transparent 1px), radial-gradient(circle at 52% 38%, rgba(232,201,122,0.05) 1px, transparent 1px), radial-gradient(circle at 75% 55%, rgba(201,169,97,0.055) 1px, transparent 1px), radial-gradient(circle at 33% 68%, rgba(232,201,122,0.04) 1px, transparent 1px), radial-gradient(circle at 88% 25%, rgba(201,169,97,0.05) 1px, transparent 1px), radial-gradient(circle at 10% 80%, rgba(232,201,122,0.045) 1px, transparent 1px), radial-gradient(circle at 62% 72%, rgba(201,169,97,0.05) 1px, transparent 1px), radial-gradient(circle at 45% 12%, rgba(232,201,122,0.04) 1px, transparent 1px);
            background-size: 24px 24px, 28px 28px, 40px 40px, 48px 48px, 36px 36px, 44px 44px, 38px 38px, 42px 42px, 46px 46px, 34px 34px; mix-blend-mode: overlay; }
        [data-theme="light"]::after { opacity:0.5;
            background-image: linear-gradient(118deg, rgba(100,120,140,0.06), rgba(80,100,125,0.015) 30%, rgba(110,130,150,0.04) 60%, rgba(90,110,130,0.02)), repeating-linear-gradient(90deg, rgba(80,90,110,0.05) 0px, rgba(80,90,110,0.05) 1px, transparent 1px, transparent 14px), repeating-linear-gradient(0deg, rgba(100,110,125,0.04) 0px, rgba(100,110,125,0.04) 1px, transparent 1px, transparent 14px), repeating-linear-gradient(35deg, rgba(90,105,120,0.03) 0px, rgba(90,105,120,0.03) 1px, transparent 1px, transparent 22px), repeating-linear-gradient(-55deg, rgba(110,125,140,0.025) 0px, rgba(110,125,140,0.025) 1px, transparent 1px, transparent 26px);
            background-size: 100% 100%, 28px 28px, 28px 28px, 40px 40px, 36px 36px; mix-blend-mode: multiply; }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
        input, textarea, select { -webkit-user-select:text; user-select:text; font-family:var(--font); background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:var(--radius-xs); outline:none; transition:var(--transition); }
        [data-theme="light"] input, [data-theme="light"] textarea, [data-theme="light"] select { background:rgba(255,255,255,0.7); }
        input:focus, textarea:focus, select:focus { border-color:var(--accent); box-shadow:0 0 14px var(--accent-glow); }
        body { font-family:var(--font); background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; padding-top:var(--safe-top); position:relative; letter-spacing:0.3px; overscroll-behavior: none; }

        .loading-veil { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); backdrop-filter:blur(12px); z-index:3000; display:flex; align-items:center; justify-content:center; flex-direction:column; transition:opacity 0.45s; font-family:var(--font); letter-spacing:2px; }
        .loading-veil.hide { opacity:0; visibility:hidden; pointer-events:none; }
        #loading-canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        .loading-quote { position:absolute; z-index:2; color:var(--text2); font-size:14px; letter-spacing:2px; text-align:center; font-style:italic; opacity:0.85; width:300px; left:50%; transform:translateX(-50%); border-left:2px solid var(--accent); padding-left:18px; transition:opacity 0.5s; }

        .sidebar { width:var(--sidebar-w); height:100vh; background:var(--surface); backdrop-filter:var(--frosted-glass); border-right:1px solid var(--border); display:flex; flex-direction:column; transition:transform 0.35s; z-index:100; flex-shrink:0; box-shadow:var(--shadow-panel); }
        .sidebar::after { content:''; position:absolute; top:0; right:0; width:1px; height:100%; background:var(--accent); opacity:0.15; }
        .sidebar.collapsed { transform:translateX(-100%); width:0; }
        .sidebar-tabs { display:flex; border-bottom:1px solid var(--border); background:rgba(0,0,0,0.08); }
        .sidebar-tab { flex:1; padding:14px 6px; text-align:center; cursor:pointer; font-size:13px; color:var(--text3); border-bottom:1px solid transparent; transition:var(--transition); letter-spacing:2px; text-transform:uppercase; }
        .sidebar-tab:hover, .sidebar-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
        .sidebar-panel { flex:1; overflow-y:auto; display:none; flex-direction:column; padding:12px; }
        .sidebar-panel.active { display:flex; }

        .notes-subtabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:12px; }
        .notes-subtab { flex:1; padding:8px 4px; text-align:center; cursor:pointer; font-size:12px; color:var(--text3); border-bottom:1px solid transparent; transition:var(--transition); letter-spacing:1px; }
        .notes-subtab:hover, .notes-subtab.active { color:var(--accent); border-bottom-color:var(--accent); }

        .notes-list-header { display:flex; gap:6px; padding:4px 0 12px; align-items:center; flex-wrap:wrap; }
        .notes-list-header input { flex:1; min-width:120px; }
        .filter-tag { font-size:11px; padding:4px 10px; background:var(--accent-light); color:var(--accent); border-radius:10px; display:inline-flex; align-items:center; gap:4px; }
        .filter-tag .clear-filter { cursor:pointer; margin-left:4px; opacity:0.7; }
        .filter-tag .clear-filter:hover { opacity:1; }
        .notes-list, .projects-list, .review-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
        .note-item, .project-item, .review-item { padding:12px; border-radius:var(--radius-xs); cursor:pointer; border-left:2px solid transparent; font-size:14px; display:flex; justify-content:space-between; align-items:center; background:var(--surface2); backdrop-filter:blur(4px); transition:var(--transition); }
        .note-item:hover, .project-item:hover, .review-item:hover { background:var(--accent-light); border-left-color:var(--accent); }
        .note-title, .project-title, .review-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .note-del, .project-del, .review-del { visibility:hidden; cursor:pointer; color:#8B0000; font-size:18px; opacity:0.6; transition:opacity 0.2s; }
        .note-del:hover, .project-del:hover, .review-del:hover { opacity:1; }
        .note-item:hover .note-del, .project-item:hover .project-del, .review-item:hover .review-del { visibility:visible; }

        .btn { padding:10px 18px; font-size:13px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; letter-spacing:1.5px; border-radius:1px; transition:all 0.25s; white-space:nowrap; text-transform:uppercase; box-shadow:0 1px 0 rgba(0,0,0,0.2); }
        .btn:hover { background:var(--accent); color:var(--bg); transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,0.3); }
        .btn:active { transform:translateY(0); box-shadow:0 1px 0 rgba(0,0,0,0.2); }
        .btn-accent { background:var(--accent); color:var(--bg); }
        .btn-accent:hover { background:var(--accent2); }
        .btn-outline { border-color:var(--text3); color:var(--text2); }
        .btn-outline:hover { border-color:var(--accent); color:var(--accent); background:transparent; }

        .main-area { flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        .sidebar-mask, .reminder-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:99; }
        .sidebar-mask.show, .reminder-mask.show { display:block; }
        .top-bar { height:var(--header-h); display:flex; align-items:center; padding:0 20px; gap:16px; border-bottom:1px solid var(--border); background:var(--surface); backdrop-filter:var(--frosted-glass); flex-shrink:0; z-index:50; }
        .hamburger { cursor:pointer; font-size:20px; background:none; border:none; color:var(--accent); padding:6px; }
        .page-title { font-weight:400; font-size:18px; letter-spacing:4px; color:var(--accent); }
        .spacer { flex:1; }
        .reminder-btn, .theme-toggle { cursor:pointer; font-size:20px; padding:8px; background:none; border:none; color:var(--text2); }
        .reminder-btn:hover, .theme-toggle:hover { color:var(--accent); }

        .content-area { flex:1; overflow-y:auto; padding:20px; gap:20px; display:flex; flex-direction:column; overscroll-behavior: contain; }
        .top-panels { display:flex; gap:20px; min-height:280px; }
        .panel { flex:1; background:var(--surface); backdrop-filter:var(--frosted-glass); border:1px solid var(--border); border-radius:var(--radius-sm); padding:20px; display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow-panel); animation: candleBreathe 4s ease-in-out infinite; }
        .panel:nth-child(2) { animation-delay: -1.5s; }
        .gantt-panel { animation: candleBreathe 5s ease-in-out infinite; animation-delay: -3s; }
        @keyframes candleBreathe { 0%,100%{ box-shadow: var(--shadow-panel); } 50%{ box-shadow: 0 8px 40px rgba(0,0,0,0.55), 0 0 8px var(--accent-glow), 0 0 20px rgba(201,169,97,0.08); } }
        .panel-header { font-size:16px; font-weight:400; color:var(--accent); letter-spacing:2px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:12px; }
        .panel-body { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }

        .todo-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); position:relative; }
        .todo-checkbox { width:18px; height:18px; border-radius:50%; border:1px solid var(--accent); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; color:transparent; flex-shrink:0; }
        .todo-checkbox.done { background:var(--accent); color:var(--bg); }
        .todo-text { flex:1; font-size:14px; }
        .todo-text.done { text-decoration:line-through; opacity:0.4; }
        .todo-priority { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .priority-high { background:#8B0000; } .priority-mid { background:#C9A961; } .priority-low { background:#5b7a6a; }
        .todo-remind-btn { visibility:hidden; cursor:pointer; font-size:16px; opacity:0.7; background:none; border:none; color:var(--accent); padding:2px 4px; display:flex; align-items:center; }
        .todo-remind-btn.has-reminder { color:var(--accent2); opacity:1; }
        .todo-item:hover .todo-remind-btn, .todo-item .todo-remind-btn.has-reminder { visibility:visible; }
        .todo-del { visibility:hidden; cursor:pointer; color:#8B0000; font-size:16px; opacity:0.5; }
        .todo-del:hover { opacity:1; }
        .todo-item:hover .todo-del { visibility:visible; }
        .reminder-inline-row { display:flex; align-items:center; gap:8px; padding:6px 0 10px 28px; background:var(--accent-light); margin-top:4px; border-radius:2px; flex-wrap:wrap; }
        .reminder-inline-row input { flex:1; min-width:130px; padding:6px; }
        .reminder-inline-row .btn { padding:6px 12px; font-size:12px; }

        .add-todo-row { display:flex; gap:6px; padding:8px 0 0; align-items:center; }
        .add-todo-row input { flex:1; }
        .add-todo-row select { max-width:70px; }
        .review-entry { display:flex; align-items:center; gap:8px; padding:12px; margin-top:12px; background:linear-gradient(135deg, var(--accent-light), transparent); border-radius:var(--radius-xs); cursor:pointer; border:1px dashed var(--accent); font-size:14px; color:var(--accent); }

        .cal-widget { padding:8px; }
        .cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:12px; }
        .cal-day { position:relative; padding:10px 4px; cursor:pointer; border-radius:var(--radius-xs); color:var(--text2); min-width:32px; min-height:32px; display:flex; align-items:center; justify-content:center; border:1px solid transparent; }
        .cal-day.today { background:var(--accent); color:#0f0c0a; font-weight:600; }
        .cal-day.has-notes::after { content:''; position:absolute; bottom:5px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--accent2); }
        .cal-day.other-month { opacity:0.3; }

        .gantt-panel { flex:1; min-height:320px; background:var(--surface); backdrop-filter:var(--frosted-glass); border:1px solid var(--border); border-radius:var(--radius-sm); padding:20px; display:flex; flex-direction:column; overflow:hidden; }
        .gantt-viewport { flex:1; overflow:auto; }
        .gantt-row { display:flex; align-items:center; height:var(--gantt-row-h); border-bottom:1px solid rgba(255,255,255,0.04); }
        .gantt-label { width:150px; flex-shrink:0; padding:0 12px; font-size:13px; background:rgba(0,0,0,0.3); position:sticky; left:0; z-index:2; }
        .gantt-timeline { position:relative; flex:1; min-width:600px; }
        .gantt-bar { position:absolute; top:6px; height:calc(var(--gantt-row-h) - 12px); border-radius:2px; cursor:pointer; display:flex; align-items:center; padding:0 8px; font-size:10px; color:#fff; min-width:20px; }
        .gantt-bar .progress-fill { position:absolute; left:0; top:0; height:100%; background:rgba(255,255,255,0.2); border-radius:2px 0 0 2px; }
        .resize-handle { position:absolute; right:0; top:0; width:10px; height:100%; cursor:ew-resize; background:transparent; }
        .gantt-header-row { display:flex; height:32px; border-bottom:1px solid var(--border); }
        .gantt-header-label { width:150px; flex-shrink:0; background:rgba(0,0,0,0.3); position:sticky; left:0; z-index:2; }
        .gantt-header-days { display:flex; flex:1; min-width:600px; }
        .gantt-day-header { flex:1; text-align:center; font-size:10px; padding:6px 0; color:var(--text3); border-right:1px solid rgba(255,255,255,0.03); }
        .gantt-day-header.weekend { background:rgba(139,0,0,0.1); }
        .gantt-day-header.today-col { background:rgba(201,169,97,0.1); font-weight:600; color:var(--accent); }

        .gantt-project-item, .gantt-task-mini-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; transition:var(--transition); }
        .gantt-project-item:hover, .gantt-task-mini-item:hover { background:var(--accent-light); }
        .gantt-project-item .project-name, .gantt-task-mini-item .task-name { flex:1; font-size:13px; }
        .gantt-project-item .project-count, .gantt-task-mini-item .task-progress { font-size:10px; color:var(--text3); margin-right:4px; }
        .gantt-project-item .project-del, .gantt-task-mini-item .task-del { visibility:hidden; cursor:pointer; color:#8B0000; font-size:16px; opacity:0.5; }
        .gantt-project-item:hover .project-del, .gantt-task-mini-item:hover .task-del { visibility:visible; }
        .task-color-dot { width:10px; height:10px; border-radius:2px; box-shadow:0 0 4px rgba(0,0,0,0.3); flex-shrink:0; }

        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); z-index:3000; display:flex; align-items:center; justify-content:center; padding:12px; }
        .modal { background:var(--surface); backdrop-filter:var(--frosted-glass); border:1px solid var(--accent); border-left:3px solid var(--accent); border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); padding:24px; max-width:560px; width:100%; max-height:85vh; overflow-y:auto; }
        .modal h3 { margin-bottom:16px; color:var(--accent); font-weight:400; letter-spacing:2px; }
        .modal input, .modal textarea, .modal select { margin-bottom:12px; width:100%; }
        .modal textarea { min-height:100px; }
        .btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
        .tag-list { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
        .tag-chip { padding:6px 14px; border-radius:12px; font-size:12px; cursor:pointer; background:var(--surface2); color:var(--text2); border:1px solid transparent; }
        .tag-chip.selected { border-color:var(--accent); background:var(--accent-light); color:var(--accent); }
        .habit-check-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); }

        .note-block { margin-top:16px; }
        .note-block-title { font-size:12px; letter-spacing:2px; color:var(--accent); border-bottom:1px dashed var(--border); display:inline-block; margin-bottom:12px; }
        .note-preview-item { padding:8px 0; border-bottom:1px solid var(--border-light); cursor:pointer; }
        .note-preview-item:hover { background:var(--accent-light); padding-left:8px; }
        .toast { position:fixed; bottom:32px; right:32px; background:var(--accent); color:var(--bg); padding:12px 24px; border-radius:2px; font-size:14px; z-index:999; box-shadow:var(--shadow-lg); }


        /* 秘书聊天 */
        .chat-panel { display:flex; flex-direction:column; height:100%; }
        .chat-messages { flex:1; overflow-y:auto; padding:8px 0; display:flex; flex-direction:column; gap:8px; }
        .chat-msg { max-width:90%; padding:10px 14px; border-radius:2px; font-size:13px; line-height:1.6; animation:fadeInUp 0.3s; }
        .chat-msg.user { align-self:flex-end; background:var(--accent); color:var(--bg); border-bottom-right-radius:0; }
        .chat-msg.assistant { align-self:flex-start; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-bottom-left-radius:0; }
        .chat-msg .msg-time { font-size:10px; opacity:0.5; margin-top:4px; }
        .chat-input-row { display:flex; gap:6px; padding:8px 0 0; border-top:1px solid var(--border); }
        .chat-input-row input { flex:1; }
        .chat-input-row button { padding:8px 16px; }
        .chat-status { font-size:10px; color:var(--text3); text-align:center; padding:4px; }
        .chat-welcome { text-align:center; padding:20px; color:var(--text3); font-style:italic; letter-spacing:1px; }

        /* 右侧提醒栏 */
        .reminder-sidebar { position:fixed; top:0; right:0; width:var(--sidebar-w); height:100vh; background:var(--surface); backdrop-filter:var(--frosted-glass); border-left:1px solid var(--border); display:flex; flex-direction:column; box-shadow:var(--shadow-panel); z-index:200; transform:translateX(100%); transition:transform 0.35s; padding-top:var(--safe-top); }
        .reminder-sidebar.open { transform:translateX(0); }
        .reminder-sidebar-header { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
        .reminder-sidebar-tabs { display:flex; border-bottom:1px solid var(--border); }
        .reminder-sidebar-tab { flex:1; padding:12px 4px; text-align:center; cursor:pointer; font-size:13px; color:var(--text3); letter-spacing:2px; }
        .reminder-sidebar-tab.active { color:var(--accent); border-bottom:2px solid var(--accent); }
        .reminder-panel { flex:1; overflow-y:auto; padding:12px; display:none; flex-direction:column; }
        .reminder-panel.active { display:flex; }
        .reminder-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-light); }

    <!-- 弹窗 -->
    <div class="modal-overlay" id="project-3c-modal" style="display:none;"><div class="modal"><h3>编辑工程</h3><input type="text" id="project-3c-name" placeholder="工程名称"><textarea id="project-3c-concentration" placeholder="浓缩点…"></textarea><textarea id="project-3c-capture" placeholder="抓点…"></textarea><div class="btn-row"><button class="btn btn-outline" onclick="closeProject3C()">取消</button><button class="btn btn-accent" onclick="saveProject3C()">保存</button></div></div></div>

    <div class="modal-overlay" id="review-modal" style="display:none;"><div class="modal"><h3>夜间复盘 <span id="review-date-label"></span></h3><div><strong>目标</strong><textarea id="review-goal" placeholder="今日目标…" style="min-height:60px;"></textarea></div><div><strong>经历</strong><textarea id="review-experience" placeholder="今日经历…" style="min-height:60px;"></textarea></div><div><strong>问题</strong><textarea id="review-problem" placeholder="遇到的问题…" style="min-height:60px;"></textarea></div><div><strong>改变</strong><textarea id="review-change" placeholder="可能的改变…" style="min-height:60px;"></textarea></div><div style="margin-top:12px;"><strong>习惯律动：</strong><div id="habit-check-list" style="margin:8px 0;"></div><button class="btn btn-outline" onclick="addHabitPrompt()">＋ 添加习惯</button></div><div class="btn-row"><button class="btn btn-outline" onclick="closeReviewModal()">取消</button><button class="btn btn-accent" onclick="saveReview()">铭记复盘</button></div></div></div>
    <div class="modal-overlay" id="setup-modal" style="display:none;"><div class="modal"><h3>司辰，请出示密钥</h3><p style="font-size:13px;color:var(--text2);">Gist ID 与 Token 仅存于这台设备的流溢中。<br>它们连通「箱子」深处的备份。</p><input type="text" id="setup-gist-id" placeholder="Gist ID"><input type="password" id="setup-gist-token" placeholder="GitHub Token"><div class="btn-row"><button class="btn btn-accent" onclick="saveSetup()">同步并归拢</button></div><p style="font-size:10px;color:var(--text3);">若暂不联机，关闭此窗亦可离线书写。</p></div></div>

    <script>
        (function(){
            // 加载动画 (保持不变)
            function initLoadingAnimation() {
                const canvas = document.getElementById('loading-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const quoteEl = document.getElementById('loading-quote-text');
                let width, height, groundY, regionCenterX, regionCenterY;
                let CENTER_ABOVE_GROUND = 120, QUOTE_BELOW_GROUND = 30, BIG_RADIUS = 80, LINE_WIDTH = 5;
                let GAP = 2 * LINE_WIDTH, OUTER_R, INNER_R, MID_R;
                let SMALL_ARC_DEG = 144, BIG_ARC_GAP_DEG = 90;
                let MAX_RAIN = 110, RAIN_LENGTH_MIN = 18, RAIN_LENGTH_MAX = 40;
                let RAIN_LINE_WIDTH_MIN = 0.6, RAIN_LINE_WIDTH_MAX = 1.4, SPLASH_RADIUS = 1.6;
                function updateParameters() {
                    const mobile = window.innerWidth <= 900;
                    BIG_RADIUS = mobile ? 55 : 80; LINE_WIDTH = mobile ? 3.5 : 5;
                    CENTER_ABOVE_GROUND = mobile ? 100 : 120; QUOTE_BELOW_GROUND = mobile ? 25 : 30;
                    MAX_RAIN = mobile ? 70 : 110; RAIN_LENGTH_MIN = mobile ? 10 : 18; RAIN_LENGTH_MAX = mobile ? 22 : 40;
                    RAIN_LINE_WIDTH_MIN = mobile ? 0.4 : 0.6; RAIN_LINE_WIDTH_MAX = mobile ? 0.8 : 1.4; SPLASH_RADIUS = mobile ? 1.2 : 1.6;
                    GAP = 2*LINE_WIDTH; OUTER_R = BIG_RADIUS+GAP/2; INNER_R = BIG_RADIUS-GAP/2; MID_R = BIG_RADIUS;
                }
                let animStartTime = null, CYCLE_DURATION = 3500, smallMidAngle = 135, bigGapMidAngle = 135;
                class RainDrop {
                    constructor() { this.reset(true); }
                    reset(init) {
                        this.x = Math.random()*width; this.y = init ? Math.random()*height : -30;
                        this.speed = Math.random()*5+7; this.length = RAIN_LENGTH_MIN+Math.random()*(RAIN_LENGTH_MAX-RAIN_LENGTH_MIN);
                        this.opacity = Math.random()*0.5+0.6; this.lineWidth = RAIN_LINE_WIDTH_MIN+Math.random()*(RAIN_LINE_WIDTH_MAX-RAIN_LINE_WIDTH_MIN);
                    }
                    update() { this.y += this.speed; if(this.y > groundY) { for(let i=0;i<3;i++) splashes.push(new Splash(this.x,groundY)); this.reset(); } }
                    draw(ctx) { ctx.beginPath(); ctx.moveTo(this.x,this.y); ctx.lineTo(this.x+this.length*0.1,this.y-this.length); ctx.strokeStyle=`rgba(232,201,122,${this.opacity})`; ctx.lineWidth=this.lineWidth; ctx.stroke(); }
                }
                class Splash {
                    constructor(x,y) { this.x=x; this.y=y; this.vx=(Math.random()-0.5)*2.2; this.vy=-(Math.random()*3+1.8); this.life=1; this.decay=Math.random()*0.03+0.025; }
                    update() { this.life-=this.decay; this.x+=this.vx; this.y+=this.vy; this.vy+=0.08; }
                    draw(ctx) { ctx.fillStyle=`rgba(201,169,97,${this.life*0.7})`; ctx.beginPath(); ctx.arc(this.x,this.y,SPLASH_RADIUS,0,Math.PI*2); ctx.fill(); }
                }
                const raindrops = [], splashes = [];
                function resize() {
                    width = canvas.width = canvas.offsetWidth; height = canvas.height = canvas.offsetHeight; updateParameters();
                    groundY = (window.innerWidth<=900) ? height*0.68+15 : height*0.72;
                    regionCenterX = width/2; regionCenterY = groundY - CENTER_ABOVE_GROUND;
                    quoteEl.style.bottom = (height-groundY-QUOTE_BELOW_GROUND)+'px'; quoteEl.style.top='auto';
                    raindrops.length=0; for(let i=0;i<MAX_RAIN;i++) raindrops.push(new RainDrop());
                }
                window.addEventListener('resize',resize);
                function twoPhaseEase(t) { return t<0.5?2*t*t:1-2*(1-t)*(1-t); }
                function updateAngles(now) {
                    if(!animStartTime) animStartTime=now;
                    let elapsed = (now-animStartTime)%CYCLE_DURATION;
                    if(elapsed<1000){ let t=twoPhaseEase(elapsed/1000); smallMidAngle=135+t*180; bigGapMidAngle=135; }
                    else if(elapsed<1500){ let t=twoPhaseEase((elapsed-1000)/500); bigGapMidAngle=135-t*180; smallMidAngle=315; }
                    else if(elapsed<2500){ let t=twoPhaseEase((elapsed-1500)/1000); smallMidAngle=315+t*180; bigGapMidAngle=315; }
                    else { let t=twoPhaseEase((elapsed-2500)/1000); bigGapMidAngle=315-t*180; smallMidAngle=495; }
                    smallMidAngle=((smallMidAngle%360)+360)%360; bigGapMidAngle=((bigGapMidAngle%360)+360)%360;
                }
                function drawArcsAtOrigin(opacity,shadow) {
                    ctx.save(); ctx.lineWidth=LINE_WIDTH; ctx.lineCap='butt';
                    if(shadow){ ctx.shadowBlur=10; ctx.shadowColor='rgba(201,169,97,0.7)'; } else { ctx.shadowBlur=0; ctx.shadowColor='transparent'; }
                    let gs=bigGapMidAngle-BIG_ARC_GAP_DEG/2, ge=bigGapMidAngle+BIG_ARC_GAP_DEG/2;
                    function drawBig(r,color){ ctx.beginPath(); ctx.arc(0,0,r,(ge*Math.PI)/180,((gs+360)*Math.PI)/180); ctx.strokeStyle=color; ctx.stroke(); }
                    drawBig(OUTER_R,`rgba(201,169,97,${opacity})`); drawBig(INNER_R,`rgba(201,169,97,${opacity})`);
                    let half=SMALL_ARC_DEG/2, ss=smallMidAngle-half, se=smallMidAngle+half;
                    ctx.beginPath(); ctx.arc(0,0,MID_R,(ss*Math.PI)/180,(se*Math.PI)/180); ctx.strokeStyle=`rgba(232,201,122,${opacity})`; ctx.stroke();
                    ctx.restore();
                }
                function drawArcs(opacity=1.0){ ctx.save(); ctx.translate(regionCenterX,regionCenterY); drawArcsAtOrigin(opacity,true); ctx.restore(); }
                function drawReflection(){ ctx.save(); ctx.translate(regionCenterX,groundY); ctx.scale(1,-0.5); ctx.translate(0,-CENTER_ABOVE_GROUND); ctx.globalAlpha=0.45; drawArcsAtOrigin(0.65,false); ctx.globalAlpha=1; ctx.restore(); }
                function drawGroundLine(){ ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(width,groundY); ctx.strokeStyle='rgba(201,169,97,0.25)'; ctx.lineWidth=0.7; ctx.stroke(); }
                function animate(now){
                    if(!width||!height) resize();
                    ctx.clearRect(0,0,width,height);
                    let grd=ctx.createRadialGradient(regionCenterX,regionCenterY,20,regionCenterX,regionCenterY,420);
                    grd.addColorStop(0,'rgba(201,169,97,0.06)'); grd.addColorStop(1,'rgba(26,23,20,0)');
                    ctx.fillStyle=grd; ctx.fillRect(0,0,width,height);
                    updateAngles(now); drawReflection(); drawGroundLine(); drawArcs(1.0);
                    raindrops.forEach(d=>{d.update(); d.draw(ctx);});
                    for(let i=splashes.length-1;i>=0;i--){ splashes[i].update(); splashes[i].draw(ctx); if(splashes[i].life<=0) splashes.splice(i,1); }
                    requestAnimationFrame(animate);
                }
                resize(); requestAnimationFrame(animate);
            }
            window.addEventListener('load', initLoadingAnimation);

            // ========== 数据与存储 ==========
            let GIST_ID = localStorage.getItem('pkm_gist_id') || '';
            let GIST_TOKEN = localStorage.getItem('pkm_gist_token') || '';
            const SYNC_ENABLED = true, STORAGE_KEY = 'pkm_app_data_v2', SETTINGS_KEY = 'pkm_app_settings_v3';
            function getDefaultData() { return { notes:[], todos:[], dailyTodos:{}, reviews:{}, habits:[], ganttProjects:[], activeGanttProjectId:null, projects3C:[], routineReminders:[], lastGanttReminderDate:null }; }
            function loadLocalData() { try{ let raw=localStorage.getItem(STORAGE_KEY); return raw ? Object.assign(getDefaultData(), JSON.parse(raw)) : getDefaultData(); }catch(e){} return getDefaultData(); }
            function saveLocalData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
            async function fetchFromGist() { if(!SYNC_ENABLED||!GIST_ID||!GIST_TOKEN) return null; try{ let res=await fetch(`https://api.github.com/gists/${GIST_ID}`,{headers:{Authorization:`token ${GIST_TOKEN}`}}); if(!res.ok) throw new Error(); let gist=await res.json(); let file=gist.files['pkm_data.json']; return file?.content ? Object.assign(getDefaultData(),JSON.parse(file.content)) : null; }catch(e){ return null; } }
            async function pushToGist(d) { if(!SYNC_ENABLED||!GIST_ID||!GIST_TOKEN) return; try{ await fetch(`https://api.github.com/gists/${GIST_ID}`,{method:'PATCH',headers:{Authorization:`token ${GIST_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({files:{'pkm_data.json':{content:JSON.stringify(d,null,2)}}})}); }catch(e){} }

            let appData = loadLocalData();
            if(!appData.routineReminders) appData.routineReminders = [];
            if(!appData.hasOwnProperty('lastGanttReminderDate')) appData.lastGanttReminderDate = null;
            let appSettings = (()=>{ try{ let raw=localStorage.getItem(SETTINGS_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){} return {}; })();
            function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
            let currentDate = new Date().toISOString().split('T')[0];
            let sidebarNoteFilterDate = null;

            const loadingVeil = document.getElementById('loading-veil'),
                  setupModal = document.getElementById('setup-modal'),
                  noteModal = document.getElementById('note-modal'),
                  reviewModal = document.getElementById('review-modal'),
                  project3cModal = document.getElementById('project-3c-modal');

            // 笔记

            function addHabitPrompt(){ let n=prompt('习惯之名：'); if(n&&n.trim()){ if(appData.habits.some(h=>h.name===n.trim()))return; appData.habits.push({id:genId(),name:n.trim()}); saveData(appData); renderHabitChecks(currentDate); } }
            function deleteHabit(id){ if(!confirm('抹除习惯？'))return; appData.habits=appData.habits.filter(h=>h.id!==id); saveData(appData); renderHabitChecks(currentDate); }
            function saveReview(){
                let goal=document.getElementById('review-goal').value, experience=document.getElementById('review-experience').value, problem=document.getElementById('review-problem').value, change=document.getElementById('review-change').value;
                let habits={}; document.querySelectorAll('#habit-check-list input').forEach(cb=>habits[cb.dataset.habit]=cb.checked);

                let fullContent=`# 复盘 ${currentDate}\n\n## 目标\n${goal}\n\n## 经历\n${experience}\n\n## 问题\n${problem}\n\n## 改变\n${change}`;
                let exist=appData.notes.find(n=>n.type==='review'&&n.date===currentDate);
                if(exist){ exist.content=fullContent; exist.updatedAt=new Date().toISOString(); } else appData.notes.unshift({id:genId(),title:`复盘 ${currentDate}`,content:fullContent,type:'review',tags:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),date:currentDate});
                saveData(appData); closeReviewModal(); renderReviewList(); renderDatePanel(); renderCalendarWidget();

            reviewModal.addEventListener('click',e=>{ if(e.target===reviewModal) closeReviewModal(); });

            // 待办与日历
            function renderDatePanel(){ let today=getToday(); document.getElementById('date-title-text').textContent = (currentDate===today)?'☉ 今日残片':'☉ 择日残片'; document.getElementById('selected-date-label').textContent=formatDate(currentDate); let daily=appData.dailyTodos[currentDate]||[]; document.getElementById('daily-todo-list').innerHTML = daily.map((t,i)=>`<div class="todo-item"><div class="todo-checkbox${t.completed?' done':''}" onclick="toggleDailyTodo(${i})">${t.completed?'✔':''}</div><span class="todo-text${t.completed?' done':''}">${escapeHtml(t.title)}</span><span class="todo-priority priority-${t.priority||'mid'}"></span><span class="todo-del" onclick="deleteDailyTodo(${i})">✕</span></div>`).join('') || '<div style="padding:20px;color:var(--text3);">此日未镌刻任务</div>'; let related=appData.notes.filter(n=>n.date===currentDate&&n.type!=='review').sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt)); document.getElementById('date-related-notes').innerHTML = related.map(n=>`<div class="note-preview-item" onclick="openNoteEditor('${n.id}')"><div>${escapeHtml(n.title||'无题')}</div><div style="font-size:12px;color:var(--text3);">${(n.content||'').substring(0,60)}${(n.content||'').length>60?'…':''}</div></div>`).join('') || '<div style="color:var(--text3);padding:8px;">尚无笔迹落于此日</div>'; }
            function addDailyTodo(){ let t=document.getElementById('daily-todo-input').value.trim(); if(!t)return; if(!appData.dailyTodos[currentDate]) appData.dailyTodos[currentDate]=[]; appData.dailyTodos[currentDate].push({id:genId(),title:t,completed:false,priority:document.getElementById('daily-todo-priority').value}); document.getElementById('daily-todo-input').value=''; saveData(appData); renderDatePanel(); renderCalendarWidget(); }
            function toggleDailyTodo(i){ if(appData.dailyTodos[currentDate]?.[i]){ appData.dailyTodos[currentDate][i].completed=!appData.dailyTodos[currentDate][i].completed; saveData(appData); renderDatePanel(); } }
            function deleteDailyTodo(i){ if(appData.dailyTodos[currentDate]){ appData.dailyTodos[currentDate].splice(i,1); if(!appData.dailyTodos[currentDate].length) delete appData.dailyTodos[currentDate]; saveData(appData); renderDatePanel(); renderCalendarWidget(); } }

            function renderTodos(){
                let sorted=[...appData.todos].sort((a,b)=>(a.completed!==b.completed?a.completed?1:-1:({high:0,mid:1,low:2}[a.priority]||1)-({high:0,mid:1,low:2}[b.priority]||1)));
                document.getElementById('todo-list').innerHTML=sorted.map(t=>{
                    let hasReminder = !!t.remindAt;
                    let remindStr = hasReminder ? new Date(t.remindAt).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
                    return `<div class="todo-item"><div class="todo-checkbox${t.completed?' done':''}" onclick="toggleTodo('${t.id}')">${t.completed?'✔':''}</div><span class="todo-text${t.completed?' done':''}">${escapeHtml(t.title)}</span><span class="todo-priority priority-${t.priority||'mid'}"></span><button class="todo-remind-btn ${hasReminder?'has-reminder':''}" onclick="event.stopPropagation();toggleTodoReminder('${t.id}')" title="${hasReminder?'更改提醒：'+remindStr:'设置提醒'}">⌛</button><span class="todo-del" onclick="deleteTodo('${t.id}')">✕</span></div>`;
                }).join('')||'<div style="padding:20px;color:var(--text3);">暂无待办</div>';
            }
            function addTodo(){ let t=document.getElementById('todo-input').value.trim(); if(!t)return; appData.todos.push({id:genId(),title:t,completed:false,priority:document.getElementById('todo-priority').value,remindAt:null}); document.getElementById('todo-input').value=''; saveData(appData); renderTodos(); }
            function toggleTodo(id){ let t=appData.todos.find(t=>t.id===id); if(t){t.completed=!t.completed; saveData(appData); renderTodos(); renderReminderTodos();} }
            function deleteTodo(id){ appData.todos=appData.todos.filter(t=>t.id!==id); saveData(appData); renderTodos(); renderReminderTodos(); }
            function toggleTodoReminder(todoId){
                let todo = appData.todos.find(t=>t.id===todoId); if(!todo) return;
                let existing = document.querySelector(`.reminder-inline-row[data-todo-id="${todoId}"]`);
                if(existing){ existing.remove(); return; }
                document.querySelectorAll('.reminder-inline-row').forEach(r=>r.remove());
                let btn = document.querySelector(`.todo-item .todo-remind-btn[onclick*="${todoId}"]`);
                if(!btn) return;
                let row = document.createElement('div'); row.className='reminder-inline-row'; row.setAttribute('data-todo-id',todoId);
                let input = document.createElement('input'); input.type='datetime-local'; if(todo.remindAt) input.value = todo.remindAt.slice(0,16); row.appendChild(input);
                let saveBtn = document.createElement('button'); saveBtn.className='btn btn-accent'; saveBtn.textContent='保存'; saveBtn.onclick=(e)=>{ e.stopPropagation(); let val=input.value; if(val){ todo.remindAt=new Date(val).toISOString(); } else { todo.remindAt=null; } saveData(appData); renderTodos(); renderReminderTodos(); }; row.appendChild(saveBtn);
                let delBtn = document.createElement('button'); delBtn.className='btn btn-outline'; delBtn.textContent='删除'; delBtn.onclick=(e)=>{ e.stopPropagation(); todo.remindAt=null; saveData(appData); renderTodos(); renderReminderTodos(); }; row.appendChild(delBtn);
                btn.closest('.todo-item').after(row);

            let calYear,calMonth;
            function renderCalendarWidget(){ let n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth(); renderCalAt(calYear,calMonth); }
            function renderCalAt(y,m){ let months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']; let daysInMonth=new Date(y,m+1,0).getDate(), firstDay=new Date(y,m,1).getDay(), today=getToday(); let marked=new Set(); appData.notes.forEach(n=>{ let d=(n.date||n.createdAt||'').split('T')[0]; if(d)marked.add(d); }); Object.keys(appData.reviews).forEach(d=>marked.add(d)); Object.keys(appData.dailyTodos).forEach(d=>{ if(appData.dailyTodos[d]?.length)marked.add(d); }); let html=`<div class="cal-header"><button onclick="navigateCal(-1)">◀</button><span>${y}年 ${months[m]}</span><button onclick="navigateCal(1)">▶</button></div><div class="cal-grid">`; ['日','一','二','三','四','五','六'].forEach(d=>html+=`<div class="cal-day-name">${d}</div>`); let prevM=m===0?11:m-1, prevY=m===0?y-1:y, prevDays=new Date(prevY,prevM+1,0).getDate(); for(let i=firstDay-1;i>=0;i--){ let d=prevDays-i; html+=`<div class="cal-day other-month" onclick="goToDate('${prevY}-${String(prevM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}',true)">${d}</div>`; } for(let d=1;d<=daysInMonth;d++){ let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; let cls='cal-day'; if(ds===today)cls+=' today'; if(marked.has(ds))cls+=' has-notes'; html+=`<div class="${cls}" onclick="goToDate('${ds}',true)">${d}</div>`; } let rem=(firstDay+daysInMonth)%7===0?0:7-(firstDay+daysInMonth)%7, nextM=m===11?0:m+1, nextY=m===11?y+1:y; for(let d=1;d<=rem;d++) html+=`<div class="cal-day other-month" onclick="goToDate('${nextY}-${String(nextM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}',true)">${d}</div>`; html+='</div>'; document.getElementById('cal-widget').innerHTML=html; }
            function navigateCal(d){ calMonth+=d; if(calMonth>11){calMonth=0;calYear++;} if(calMonth<0){calMonth=11;calYear--;} renderCalAt(calYear,calMonth); }
            function goToDate(ds,fromSidebar=false){ currentDate=ds; renderDatePanel(); if(fromSidebar){ sidebarNoteFilterDate=ds; document.querySelectorAll('.notes-subtab').forEach(t=>t.classList.remove('active')); let tab=document.querySelector('.notes-subtab[data-sub="sub-notes"]'); if(tab)tab.click(); renderNotesList(); } else { sidebarNoteFilterDate=null; renderNotesList(); closeLeftSidebar(); } renderCalendarWidget(); }

            function refreshGanttEditor(){ let sel=document.getElementById('gantt-project-select'), view=document.getElementById('gantt-view-select'); sel.innerHTML='<option value="">-- 选本 --</option>'; view.innerHTML='<option value="">-- 选项目 --</option>'; appData.ganttProjects.forEach(p=>{ sel.innerHTML+=`<option value="${p.id}">${escapeHtml(p.name)}</option>`; view.innerHTML+=`<option value="${p.id}">${escapeHtml(p.name)}</option>`; }); document.getElementById('gantt-project-list').innerHTML=appData.ganttProjects.map(p=>`<div class="gantt-project-item" onclick="selectGanttProjectById('${p.id}')"><span class="project-name">${escapeHtml(p.name)}</span><span class="project-count">${p.tasks.length}任务</span><span class="project-del" onclick="event.stopPropagation();deleteGanttProject('${p.id}')">✕</span></div>`).join('')||'<div style="color:var(--text3);padding:8px;">尚无项目</div>'; if(appData.activeGanttProjectId){ sel.value=appData.activeGanttProjectId; view.value=appData.activeGanttProjectId; renderGanttTasksMini(); } renderGantt(); }

            function editTask(pid,tid){ let p=appData.ganttProjects.find(p=>p.id===pid); if(!p)return; let t=p.tasks.find(t=>t.id===tid); if(!t)return; document.getElementById('new-task-name').value=t.name; document.getElementById('new-task-start').value=t.startDate; document.getElementById('new-task-end').value=t.endDate; document.getElementById('new-task-progress').value=t.progress; document.getElementById('new-task-color').value=t.color; document.getElementById('task-save-btn').textContent='更新'; document.getElementById('task-cancel-btn').style.display='inline-block'; editingTaskId=tid; editingProjectId=pid; }

            function addTaskToProject(){ let pid=editingProjectId||appData.activeGanttProjectId; if(!pid){showToast('先选项目');return;} let p=appData.ganttProjects.find(p=>p.id===pid); if(!p)return; let n=document.getElementById('new-task-name').value.trim(), s=document.getElementById('new-task-start').value, e=document.getElementById('new-task-end').value, prog=parseInt(document.getElementById('new-task-progress').value)||0, col=document.getElementById('new-task-color').value; if(!n||!s||!e){showToast('填完整');return;} if(e<s){showToast('日期错误');return;} if(editingTaskId){ let t=p.tasks.find(t=>t.id===editingTaskId); if(t){ t.name=n; t.startDate=s; t.endDate=e; t.progress=Math.min(100,Math.max(0,prog)); t.color=col; } cancelEditTask(); } else { p.tasks.push({id:genId(),name:n,startDate:s,endDate:e,progress:Math.min(100,Math.max(0,prog)),color:col}); document.getElementById('new-task-name').value=''; document.getElementById('new-task-progress').value='0'; } saveData(appData); refreshGanttEditor(); }
            function deleteGanttTask(tid){ let p=appData.ganttProjects.find(p=>p.id===appData.activeGanttProjectId); if(!p)return; p.tasks=p.tasks.filter(t=>t.id!==tid); saveData(appData); refreshGanttEditor(); }
            function renderGanttTasksMini(){ let c=document.getElementById('gantt-tasks-mini-list'); if(!appData.activeGanttProjectId){c.innerHTML='';return;} let p=appData.ganttProjects.find(p=>p.id===appData.activeGanttProjectId); if(!p||!p.tasks.length){c.innerHTML='<div style="color:var(--text3);padding:8px;">无任务</div>';return;} c.innerHTML = p.tasks.map(t=>`<div class="gantt-task-mini-item" onclick="editTask('${appData.activeGanttProjectId}','${t.id}')"><span class="task-color-dot" style="background:${t.color};"></span><span class="task-name">${escapeHtml(t.name)}</span><span class="task-progress">${t.progress}%</span><span class="task-del" onclick="event.stopPropagation();deleteGanttTask('${t.id}')">✕</span></div>`).join(''); }
            function loadGanttView(){ let v=document.getElementById('gantt-view-select').value; if(v){ appData.activeGanttProjectId=v; saveData(appData); refreshGanttEditor(); } renderGantt(); }
            function renderGantt(){
                let chart=document.getElementById('gantt-chart'), dr=document.getElementById('gantt-date-range'), pid=document.getElementById('gantt-view-select').value||appData.activeGanttProjectId;
                if(!pid){ chart.innerHTML='<div style="padding:40px;">请选择项目</div>'; dr.innerHTML=''; return; }
                let p=appData.ganttProjects.find(p=>p.id===pid);
                if(!p||!p.tasks.length){ chart.innerHTML='<div style="padding:40px;">无任务</div>'; dr.innerHTML=''; return; }
                let min=null,max=null; p.tasks.forEach(t=>{ if(!min||t.startDate<min)min=t.startDate; if(!max||t.endDate>max)max=t.endDate; });
                let sD=new Date(min), eD=new Date(max); sD.setDate(sD.getDate()-1); eD.setDate(eD.getDate()+3);
                let days=[]; for(let d=new Date(sD);d<=eD;d.setDate(d.getDate()+1)) days.push(d.toISOString().split('T')[0]);
                dr.innerHTML = `<div>${sD.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})}<br>${eD.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})}</div>`;
                let today=getToday(), dw=Math.max(28,Math.floor(600/days.length));
                let h=`<div class="gantt-header-row"><div class="gantt-header-label"></div><div class="gantt-header-days">`;
                days.forEach(d=>{ let cls='gantt-day-header'; if([0,6].includes(new Date(d).getDay()))cls+=' weekend'; if(d===today)cls+=' today-col'; h+=`<div class="${cls}" style="min-width:${dw}px;">${parseInt(d.split('-')[2])}</div>`; }); h+='</div></div>';
                p.tasks.forEach(t=>{ let ts=new Date(t.startDate), te=new Date(t.endDate), left=Math.max(0,Math.ceil((ts-sD)/86400000))*dw, width=Math.max(1,Math.ceil((te-ts)/86400000)+1)*dw; h+=`<div class="gantt-row"><div class="gantt-label">${escapeHtml(t.name)}</div><div class="gantt-timeline" style="min-width:${days.length*dw}px;"><div class="gantt-bar" style="left:${left}px;width:${width}px;background:${t.color};"><div class="progress-fill" style="width:${t.progress}%;"></div><span style="position:relative;z-index:1;">${t.progress}%</span><div class="resize-handle"></div></div></div></div>`; });
                chart.innerHTML=h;
                let ti=days.indexOf(today); if(ti>=0) document.querySelector('.gantt-viewport').scrollLeft=Math.max(0,(ti-2)*dw);
            }

            // ========== 增强提醒系统（含通知权限优化）==========
            function requestNotificationPermission(){
                if(window.Notification && Notification.permission === 'default'){
                    Notification.requestPermission().then(perm => {
                        if(perm === 'granted') showToast('系统通知已开启');
                        else showToast('通知权限未授予，将使用页面提示');
                    });
                }
            }
            function sendNotification(title,body){
                if(window.Notification && Notification.permission === 'granted'){
                    try{
                        new Notification(title, { body, icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="45" fill="%23C9A961" /%3E%3Cpath d="M50 15 L55 40 L80 40 L60 55 L65 80 L50 65 L35 80 L40 55 L20 40 L45 40 Z" fill="%231a1714" /%3E%3C/svg%3E' });
                    } catch(e) {
                        showToast(`${title} ${body || ''}`);
                    }
                } else if(window.Notification && Notification.permission === 'denied') {
                    showToast(`${title} ${body || ''}`);
                } else {
                    showToast(`${title} ${body || ''}`);
                    requestNotificationPermission();
                }
            }
            function checkReminders(){
                let now=new Date(), todayDate=now.toISOString().split('T')[0], currentHour=now.getHours(), currentMinute=now.getMinutes(), currentDay=now.getDay();
                let changed=false;
                appData.todos.forEach(todo=>{ if(todo.remindAt&&!todo.completed){ let remindTime=new Date(todo.remindAt); if(Math.abs(remindTime-now)<60000){ sendNotification('⏰ 待办提醒',todo.title); todo.remindAt=null; changed=true; } } });
                if(changed) saveData(appData);
                appData.routineReminders.forEach(r=>{ if(r.days.includes(currentDay)){ let [h,m]=r.time.split(':').map(Number); if(h===currentHour&&m===currentMinute) sendNotification('📋 例行提示',r.name); } });
                if(currentHour===9&&currentMinute===0&&appData.lastGanttReminderDate!==todayDate){
                    let today = new Date(todayDate), threeDaysLater = new Date(today); threeDaysLater.setDate(threeDaysLater.getDate()+3);
                    let due=[]; appData.ganttProjects.forEach(project=>{ project.tasks.forEach(task=>{ let endDate=new Date(task.endDate+'T00:00:00'); if(endDate>=today&&endDate<=threeDaysLater) due.push(`${task.name}(${project.name}):${task.endDate}`); }); });
                    if(due.length) sendNotification('⏳ 甘特图截止提醒','即将到期: '+due.join(';'));
                    appData.lastGanttReminderDate=todayDate; saveData(appData);
                }
            }
            let reminderCheckInterval;
            function setupReminderCheck(){ if(reminderCheckInterval)clearInterval(reminderCheckInterval); reminderCheckInterval=setInterval(checkReminders,60000); checkReminders(); requestNotificationPermission(); }

            // ========== 侧栏互斥控制 ==========
            const sidebarLeft = document.getElementById('sidebar');
            const maskLeft = document.getElementById('sidebar-mask');
            const sidebarRight = document.getElementById('reminder-sidebar');
            const maskRight = document.getElementById('reminder-mask');

            function closeLeftSidebar() {
                sidebarLeft.classList.remove('open-mobile');
                maskLeft.classList.remove('show');
            }
            function closeRightSidebar() {
                sidebarRight.classList.remove('open');
                maskRight.classList.remove('show');
            }
            function toggleReminderSidebar() {
                if (!sidebarRight.classList.contains('open')) {
                    closeLeftSidebar();
                    sidebarRight.classList.add('open');
                    maskRight.classList.add('show');
                } else {
                    closeRightSidebar();
                }
            }

            document.getElementById('hamburger-btn').addEventListener('click', ()=>{
                closeRightSidebar();
                sidebarLeft.classList.toggle('open-mobile');
                maskLeft.classList.toggle('show');
            });

            maskLeft.addEventListener('click', closeLeftSidebar);
            maskRight.addEventListener('click', closeRightSidebar);
            document.getElementById('reminder-btn').addEventListener('click', toggleReminderSidebar);

            document.querySelectorAll('.reminder-sidebar-tab').forEach(tab=>{ tab.addEventListener('click',function(){ document.querySelectorAll('.reminder-sidebar-tab').forEach(t=>t.classList.remove('active')); this.classList.add('active'); document.querySelectorAll('.reminder-panel').forEach(p=>p.classList.remove('active')); document.getElementById(this.dataset.reminderPanel).classList.add('active'); if(this.dataset.reminderPanel==='reminder-todos') renderReminderTodos(); else renderRoutineList(); }); });

            function renderReminderTodos(){
                let container=document.getElementById('reminder-todo-list');
                let reminders=appData.todos.filter(t=>t.remindAt&&!t.completed).sort((a,b)=>new Date(a.remindAt)-new Date(b.remindAt));
                container.innerHTML = reminders.length ? reminders.map(t=>`<div class="reminder-item"><div class="reminder-info"><div>${escapeHtml(t.title)}</div><div class="reminder-time">${new Date(t.remindAt).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div><button class="reminder-del" onclick="deleteTodoReminder('${t.id}')">✕</button></div>`).join('') : '<div style="padding:20px;color:var(--text3);text-align:center;">暂无待办提醒</div>';
            }
            window.deleteTodoReminder=function(tid){ let t=appData.todos.find(t=>t.id===tid); if(t){ t.remindAt=null; saveData(appData); renderReminderTodos(); renderTodos(); } };
            let routineList = document.getElementById('routine-list');
            function renderRoutineList(){ routineList.innerHTML = appData.routineReminders.length ? appData.routineReminders.map(r=>`<div class="reminder-item"><div class="reminder-info"><strong>${escapeHtml(r.name)}</strong><div class="reminder-time">${r.days.map(d=>['日','一','二','三','四','五','六'][d]).join('、')} ${r.time}</div></div><button class="reminder-del" onclick="deleteRoutine('${r.id}')">✕</button></div>`).join('') : '<div style="padding:20px;color:var(--text3);text-align:center;">暂无例行提示</div>'; }
            window.deleteRoutine=function(id){ appData.routineReminders=appData.routineReminders.filter(r=>r.id!==id); saveData(appData); renderRoutineList(); };
            window.addRoutineReminder=function(){ let name=document.getElementById('routine-name').value.trim(), time=document.getElementById('routine-time').value, days=[...document.querySelectorAll('#weekday-picker .weekday-chip.selected')].map(e=>+e.dataset.day); if(!name||!time||days.length===0){showToast('请填写完整');return;} appData.routineReminders.push({id:genId(),name,days,time}); document.getElementById('routine-name').value=''; document.getElementById('routine-time').value='09:00'; document.querySelectorAll('#weekday-picker .weekday-chip').forEach(c=>c.classList.remove('selected')); saveData(appData); renderRoutineList(); };
            document.getElementById('weekday-picker').addEventListener('click',e=>{ if(e.target.classList.contains('weekday-chip')) e.target.classList.toggle('selected'); });

            function refreshAllUI(){ renderDatePanel(); renderTodos(); renderProjects3C(); renderNotesList(); renderReviewList(); renderCalendarWidget(); refreshGanttEditor(); renderGantt(); renderReminderTodos(); renderRoutineList(); setupReminderCheck(); }

            let touchStartX=0, touchStartY=0;
            document.addEventListener('touchstart',e=>{ if(window.innerWidth>900) return; touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; },{passive:true});
            document.addEventListener('touchend',e=>{
                if(window.innerWidth>900) return;
                let touch=e.changedTouches[0], deltaX=touch.clientX-touchStartX, deltaY=touch.clientY-touchStartY;
                if(Math.abs(deltaX)>30 && Math.abs(deltaX)>Math.abs(deltaY)){
                    if(touchStartX<20 && deltaX>0){ closeRightSidebar(); sidebarLeft.classList.add('open-mobile'); maskLeft.classList.add('show'); }
                    if(touchStartX>window.innerWidth-20 && deltaX<0){ closeLeftSidebar(); sidebarRight.classList.add('open'); maskRight.classList.add('show'); }
                }
            });

            document.querySelectorAll('.notes-subtab').forEach(tab=>{ tab.addEventListener('click',function(){ document.querySelectorAll('.notes-subtab').forEach(t=>t.classList.remove('active')); this.classList.add('active'); let sub=document.getElementById(this.dataset.sub); document.querySelectorAll('#panel-notes .sub-panel').forEach(p=>p.style.display='none'); sub.style.display='block'; if(sub.id==='sub-3c')renderProjects3C(); else if(sub.id==='sub-notes')renderNotesList(); else if(sub.id==='sub-reviews')renderReviewList(); }); });

            async function initApp(){
                startLoadingAnim('init');
                if(!GIST_ID||!GIST_TOKEN){ forceHideLoading(); setupModal.style.display='flex'; refreshAllUI(); return; }
                startLoadingAnim('sync');
                let cloudData = await fetchFromGist();
                if(cloudData){ appData=cloudData; saveLocalData(appData); showToast("时序归拢完毕，司辰。"); } else showToast("离线模式，本地手记犹存。");
                stopLoadingAndHide(); applyTheme(); refreshAllUI();
                requestNotificationPermission();
            }
            window.saveSetup = async function(){ let id=document.getElementById('setup-gist-id').value.trim(), token=document.getElementById('setup-gist-token').value.trim(); if(!id||!token){ alert('请完整填写'); return; } localStorage.setItem('pkm_gist_id',id); localStorage.setItem('pkm_gist_token',token); GIST_ID=id; GIST_TOKEN=token; setupModal.style.display='none'; startLoadingAnim('sync'); let cloud=await fetchFromGist(); if(cloud){ appData=cloud; saveLocalData(appData); showToast('同步成功'); } else showToast('离线模式'); stopLoadingAndHide(); refreshAllUI(); };

            window.addProject3C=addProject3C; window.deleteProject3C=deleteProject3C; window.openProject3C=openProject3C; window.closeProject3C=closeProject3C; window.saveProject3C=saveProject3C;
            window.openNoteEditor=openNoteEditor; window.closeNoteEditor=closeNoteEditor; window.saveNote=saveNote; window.deleteNote=deleteNote;
            window.addDailyTodo=addDailyTodo; window.toggleDailyTodo=toggleDailyTodo; window.deleteDailyTodo=deleteDailyTodo;
            window.addTodo=addTodo; window.toggleTodo=toggleTodo; window.deleteTodo=deleteTodo; window.toggleTodoReminder=toggleTodoReminder;
            window.openReviewModal=openReviewModal; window.closeReviewModal=closeReviewModal; window.addHabitPrompt=addHabitPrompt; window.deleteHabit=deleteHabit; window.saveReview=saveReview;
            window.clearSidebarDateFilter = ()=>{ sidebarNoteFilterDate=null; renderNotesList(); };
            window.selectGanttProject=selectGanttProject; window.selectGanttProjectById=selectGanttProjectById; window.createGanttProject=createGanttProject; window.deleteGanttProject=deleteGanttProject;
            window.editTask=editTask; window.cancelEditTask=cancelEditTask; window.addTaskToProject=addTaskToProject; window.deleteGanttTask=deleteGanttTask;
            window.loadGanttView=loadGanttView; window.navigateCal=navigateCal; window.goToDate=goToDate;
            window.saveSetup = window.saveSetup; window.deleteTodoReminder = window.deleteTodoReminder; window.deleteRoutine = window.deleteRoutine; window.addRoutineReminder = window.addRoutineReminder;

            document.querySelectorAll('.sidebar-tab').forEach(tab=>tab.addEventListener('click',function(){ document.querySelectorAll('.sidebar-tab').forEach(t=>t.classList.remove('active')); this.classList.add('active'); document.querySelectorAll('.sidebar-panel').forEach(p=>p.classList.remove('active')); document.getElementById(this.dataset.panel).classList.add('active'); if(this.dataset.panel==='panel-calendar')renderCalendarWidget(); if(this.dataset.panel==='panel-gantt-edit')refreshGanttEditor(); }));

            setupModal.addEventListener('click',e=>{ if(e.target===setupModal) setupModal.style.display='none'; });
            project3cModal.addEventListener('click',e=>{ if(e.target===project3cModal) closeProject3C(); });

            initApp();
            setInterval(()=>saveLocalData(appData),60000);

            /* ========== 秘书聊天 ========== */
            const SECRETARY_URL='https://enhancing-senate-observed-managed.trycloudflare.com/v1/chat/completions';
            const SECRETARY_KEY='sk-46c...1ef8';
            let chatHistory = [];

            function buildPKMContext() {
                let goals = appData.projects3C || [];
                let todos = (appData.todos || []).filter(t=>!t.completed).slice(0,20);
                let activeGoals = goals.filter(g=>g.status!=='completed').map(g=>'- ' + g.name + ' (' + (g.progress||0) + '%)').join('
') || '(无)';
                let pendingTodos = todos.map(t=>'- [' + (t.priority||'mid') + '] ' + t.title + (t.deadline?' 提醒:'+t.deadline:'')).join('
') || '(无)';
                let recentNotes = (appData.notes||[]).slice(-5).map(n=>'- ' + (n.title||(n.content||'').slice(0,40))).join('
') || '(无)';
                return '【用户当前数据】
活跃目标:
' + activeGoals + '

待办事项:
' + pendingTodos + '

最近笔记:
' + recentNotes + '

当前日期: ' + new Date().toLocaleDateString('zh-CN');
            }

            function addChatMsg(role, text) {
                let div = document.createElement('div');
                div.className = 'chat-msg ' + role;
                div.innerHTML = text.replace(/
/g,'<br>') + '<div class="msg-time">' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) + '</div>';
                document.getElementById('chat-messages').appendChild(div);
                div.scrollIntoView({behavior:'smooth'});
                return div;
            }

            async function sendChat() {
                let input = document.getElementById('chat-input');
                let btn = document.getElementById('chat-send-btn');
                let msg = input.value.trim();
                if(!msg) return;
                input.value = ''; input.disabled = true; btn.disabled = true;
                document.getElementById('chat-welcome').style.display = 'none';
                document.getElementById('chat-status').textContent = '管家思考中...';

                addChatMsg('user', msg);
                let ctx = buildPKMContext();
                let msgs = [
                    {role:'system', content:'你是 Hypomnema 司辰的私人管家。风格：简洁、温暖、有洞察。用中文回复。

' + ctx},
                    ...chatHistory.slice(-10),
                    {role:'user', content: msg}
                ];

                try {
                    let resp = await fetch(SECRETARY_URL, {
                        method:'POST',
                        headers:{'Content-Type':'application/json','Authorization':'Bearer '+SECRETARY_KEY},
                        body: JSON.stringify({model:'deepseek-v4-flash', messages:msgs, stream:false, max_tokens:1024})
                    });
                    if(!resp.ok) throw new Error('API '+resp.status);
                    let data = await resp.json();
                    let reply = data.choices?.[0]?.message?.content || '（管家沉默了...）';
                    addChatMsg('assistant', reply);
                    chatHistory.push({role:'user',content:msg}, {role:'assistant',content:reply});
                    if(chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
                    document.getElementById('chat-status').textContent = '';
                } catch(e) {
                    document.getElementById('chat-status').textContent = '无法连接管家';
                    addChatMsg('assistant', '抱歉，目前无法连接管家服务。');
                }
                input.disabled = false; btn.disabled = false;
                input.focus();
            }

            document.getElementById('chat-input').addEventListener('keydown', e => { if(e.key==='Enter') sendChat(); });
            window.sendChat = sendChat;
        })();
    </script>
