<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hypomnema · 司辰手记</title>
    <style>
        :root {
            --bg: #1a1714; --surface: rgba(25,22,20,0.75); --surface2: rgba(15,13,11,0.65);
            --text: #d4cfc6; --text2: #a49e94; --text3: #746e66; --accent: #C9A961; --accent2: #E8C97A;
            --accent-light: rgba(201,169,97,0.12); --border: rgba(201,169,97,0.25);
            --shadow: 0 4px 24px rgba(0,0,0,0.45); --shadow-lg: 0 16px 48px rgba(0,0,0,0.55);
            --shadow-panel: 0 8px 32px rgba(0,0,0,0.5); --radius: 2px; --radius-sm: 4px;
            --font: 'Times New Roman', 'Songti SC', serif; --transition: 0.3s ease;
            --sidebar-w: 360px; --right-sidebar-w: 360px; --header-h: 56px;
            --frosted-glass: blur(14px) saturate(180%); --safe-top: env(safe-area-inset-top);
        }
        [data-theme="light"] {
            --bg: #eef2f5; --surface: rgba(245,242,238,0.82); --surface2: rgba(235,230,225,0.7);
            --text: #2c2a2a; --text2: #4a4242; --text3: #7a6e6a; --accent: #5F7F9E; --accent2: #8EA3B9;
            --accent-light: rgba(95,127,158,0.1); --border: rgba(95,127,158,0.3);
            --shadow: 0 4px 20px rgba(0,0,0,0.06); --shadow-lg: 0 14px 40px rgba(0,0,0,0.1);
            --shadow-panel: 0 8px 28px rgba(0,0,0,0.08);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
        body { font-family:var(--font); background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; padding-top:var(--safe-top); }
        .loading-veil { position:fixed; inset:0; background:var(--bg); backdrop-filter:blur(12px); z-index:3000; display:flex; align-items:center; justify-content:center; flex-direction:column; }
        .loading-veil.hide { opacity:0; pointer-events:none; }
        #loading-canvas { position:absolute; inset:0; }
        .loading-quote { position:absolute; color:var(--text2); font-size:14px; letter-spacing:2px; font-style:italic; width:300px; left:50%; transform:translateX(-50%); border-left:2px solid var(--accent); padding-left:18px; }
        .sidebar { width:var(--sidebar-w); height:100vh; background:var(--surface); backdrop-filter:var(--frosted-glass); border-right:1px solid var(--border); display:flex; flex-direction:column; transition:0.35s; z-index:100; flex-shrink:0; padding-top:var(--safe-top); }
        .sidebar.collapsed { transform:translateX(-100%); width:0; }
        .sidebar-tabs { display:flex; border-bottom:1px solid var(--border); }
        .sidebar-tab { flex:1; padding:14px 6px; text-align:center; cursor:pointer; font-size:13px; color:var(--text3); border-bottom:1px solid transparent; text-transform:uppercase; letter-spacing:2px; }
        .sidebar-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
        .sidebar-panel { flex:1; overflow-y:auto; display:none; flex-direction:column; padding:12px; }
        .sidebar-panel.active { display:flex; }
        .right-sidebar { width:var(--right-sidebar-w); height:100vh; background:var(--surface); backdrop-filter:var(--frosted-glass); border-left:1px solid var(--border); display:flex; flex-direction:column; transition:0.35s; z-index:100; flex-shrink:0; padding-top:var(--safe-top); }
        .right-sidebar.collapsed { transform:translateX(100%); width:0; }
        .right-sidebar-tabs { display:flex; border-bottom:1px solid var(--border); }
        .right-sidebar-tab { flex:1; padding:14px 6px; text-align:center; cursor:pointer; font-size:13px; color:var(--text3); border-bottom:1px solid transparent; text-transform:uppercase; letter-spacing:2px; }
        .right-sidebar-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
        .right-sidebar-panel { flex:1; overflow-y:auto; display:none; flex-direction:column; padding:12px; }
        .right-sidebar-panel.active { display:flex; }
        .notes-subtabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:12px; }
        .notes-subtab { flex:1; padding:8px 4px; text-align:center; cursor:pointer; font-size:12px; color:var(--text3); }
        .notes-subtab.active { color:var(--accent); border-bottom:1px solid var(--accent); }
        .btn { padding:10px 18px; font-size:13px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; text-transform:uppercase; letter-spacing:1.5px; }
        .btn-accent { background:var(--accent); color:var(--bg); }
        .main-area { flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        .mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:99; }
        .mask.show { display:block; }
        .top-bar { height:var(--header-h); display:flex; align-items:center; padding:0 20px; border-bottom:1px solid var(--border); background:var(--surface); backdrop-filter:var(--frosted-glass); }
        .hamburger { font-size:20px; background:none; border:none; color:var(--accent); cursor:pointer; }
        .page-title { font-weight:400; font-size:18px; letter-spacing:4px; color:var(--accent); margin-left:12px; }
        .spacer { flex:1; }
        .content-area { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:20px; }
        .top-panels { display:flex; gap:20px; min-height:280px; }
        .panel { flex:1; background:var(--surface); backdrop-filter:var(--frosted-glass); border:1px solid var(--border); border-radius:var(--radius-sm); padding:20px; display:flex; flex-direction:column; overflow:hidden; }
        .panel-header { font-size:16px; color:var(--accent); letter-spacing:2px; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:12px; display:flex; justify-content:space-between; }
        .todo-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
        .todo-checkbox { width:18px; height:18px; border-radius:50%; border:1px solid var(--accent); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; }
        .todo-checkbox.done { background:var(--accent); color:var(--bg); }
        .todo-reminder-set { font-size:11px; margin-left:8px; color:var(--accent); cursor:pointer; }
        .reminder-item { padding:10px; border-radius:var(--radius-xs); margin-bottom:8px; background:var(--surface2); border-left:2px solid var(--accent); display:flex; justify-content:space-between; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); z-index:3000; display:flex; align-items:center; justify-content:center; }
        .modal { background:var(--surface); backdrop-filter:var(--frosted-glass); border:1px solid var(--accent); border-left:3px solid var(--accent); padding:24px; max-width:560px; width:100%; max-height:85vh; overflow-y:auto; }
        .toast { position:fixed; bottom:32px; right:32px; background:var(--accent); color:var(--bg); padding:12px 24px; z-index:999; }
        @media (max-width:900px) {
            .sidebar { position:fixed; left:0; top:0; z-index:200; width:300px; transform:translateX(-100%); }
            .sidebar.open-mobile { transform:translateX(0); }
            .right-sidebar { position:fixed; right:0; top:0; z-index:200; width:300px; transform:translateX(100%); }
            .right-sidebar.collapsed { transform:translateX(100%); }
            .content-area { padding:12px; }
            .top-panels { flex-direction:column; }
        }
    </style>
</head>
<body>
<div class="loading-veil" id="loading-veil"><canvas id="loading-canvas"></canvas><div class="loading-quote" id="loading-quote-text">归拢时序，拂去尘埃……</div></div>

<div class="mask" id="sidebar-mask"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-tabs"><div class="sidebar-tab active" data-panel="panel-notes">纪事</div><div class="sidebar-tab" data-panel="panel-calendar">月历</div><div class="sidebar-tab" data-panel="panel-gantt-edit">时序</div></div>
    <div class="sidebar-panel active" id="panel-notes">
        <div class="notes-subtabs"><div class="notes-subtab active" data-sub="sub-3c">3C</div><div class="notes-subtab" data-sub="sub-notes">笔记</div><div class="notes-subtab" data-sub="sub-reviews">复盘</div></div>
        <div id="sub-3c" class="sub-panel" style="display:block;"><button class="btn btn-accent" onclick="addProject3C()" style="width:100%; margin-bottom:8px;">＋ 新工程</button><div id="projects-3c-list"></div></div>
        <div id="sub-notes" class="sub-panel" style="display:none;"><input type="text" id="note-search" placeholder="搜索" style="margin-bottom:8px;"><button class="btn" onclick="openNoteEditor()">＋</button><div id="notes-list"></div></div>
        <div id="sub-reviews" class="sub-panel" style="display:none;"><button class="btn btn-accent" onclick="openReviewModal()" style="width:100%; margin-bottom:8px;">＋ 新复盘</button><div id="review-list"></div></div>
    </div>
    <div class="sidebar-panel" id="panel-calendar"><div id="cal-widget"></div></div>
    <div class="sidebar-panel" id="panel-gantt-edit">
        <h4>时序 · 项目</h4><select id="gantt-project-select" onchange="selectGanttProject()"><option value="">-- 选本 --</option></select>
        <input type="text" id="new-project-name" placeholder="新项目名称"><button class="btn btn-accent" onclick="createGanttProject()">创</button>
        <div id="gantt-project-list"></div><hr><h4>编纂任务</h4>
        <input type="text" id="new-task-name" placeholder="任务名"><input type="date" id="new-task-start"><input type="date" id="new-task-end">
        <input type="number" id="new-task-progress" placeholder="进度%" value="0"><select id="new-task-color"><option value="#C9A961">琥珀金</option><option value="#4A5D6F">暮霭蓝</option><option value="#8B0000">血爵红</option><option value="#5b7a6a">苔原绿</option><option value="#9B6FA0">薄暮紫</option><option value="#B0805A">古铜褐</option><option value="#3A5C5C">深海青</option><option value="#7E8B92">尘灰银</option></select>
        <button class="btn btn-accent" id="task-save-btn" onclick="addTaskToProject()">添加</button><button class="btn btn-outline" id="task-cancel-btn" onclick="cancelEditTask()" style="display:none;">取消</button>
        <div id="gantt-tasks-mini-list"></div>
    </div>
</aside>

<div class="mask" id="right-sidebar-mask"></div>
<aside class="right-sidebar collapsed" id="right-sidebar">
    <div class="right-sidebar-tabs"><div class="right-sidebar-tab active" data-rpanel="rpanel-todo">待办提醒</div><div class="right-sidebar-tab" data-rpanel="rpanel-schedule">例行提示</div></div>
    <div class="right-sidebar-panel active" id="rpanel-todo"><div id="todo-reminders-list"></div></div>
    <div class="right-sidebar-panel" id="rpanel-schedule" style="display:none;"><button class="btn btn-accent" onclick="openScheduleForm()" style="width:100%; margin-bottom:8px;">＋ 新提示</button><div id="schedule-list"></div></div>
</aside>

<div class="main-area">
    <div class="top-bar"><button class="hamburger" id="hamburger-btn">☰</button><span class="page-title">Reverse Chronicle</span><span class="spacer"></span><button id="theme-toggle" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;">◑</button><button id="reminder-toggle-btn" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;">⏳</button></div>
    <div class="content-area">
        <div class="top-panels">
            <div class="panel"><div class="panel-header"><span>☉ 今日残片</span> <span id="selected-date-label"></span></div><div id="daily-todo-list" class="panel-body"></div><div class="add-todo-row" style="display:flex;gap:6px;padding:8px 0;"><input type="text" id="daily-todo-input" placeholder="添刻今日印记…"><select id="daily-todo-priority"><option value="low">轻</option><option value="mid" selected>中</option><option value="high">重</option></select><button class="btn btn-accent" onclick="addDailyTodo()">＋</button></div><div class="review-entry" onclick="openReviewModal()" style="cursor:pointer;padding:12px;margin-top:12px;background:linear-gradient(135deg,var(--accent-light),transparent);border:1px dashed var(--accent);">→ 夜间复盘</div><div id="date-related-notes"></div></div>
            <div class="panel"><div class="panel-header">⌛ 待办列</div><div id="todo-list" class="panel-body"></div><div class="add-todo-row" style="display:flex;gap:6px;padding:8px 0;"><input type="text" id="todo-input" placeholder="新待办…"><select id="todo-priority"><option value="low">轻</option><option value="mid" selected>中</option><option value="high">重</option></select><button class="btn btn-accent" onclick="addTodo()">＋</button></div></div>
        </div>
        <div class="panel" style="min-height:320px;"><div class="panel-header">⟁ 甘特图 <select id="gantt-view-select" onchange="loadGanttView()"><option value="">-- 选项目 --</option></select></div><div id="gantt-chart">请在时序中创建项目</div></div>
    </div>
</div>

<div class="modal-overlay" id="project-3c-modal" style="display:none;"><div class="modal"><h3>编辑工程</h3><input type="text" id="project-3c-name"><textarea id="project-3c-concentration" placeholder="浓缩点…"></textarea><textarea id="project-3c-capture" placeholder="抓点…"></textarea><div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button onclick="closeProject3C()">取消</button><button class="btn-accent" onclick="saveProject3C()">保存</button></div></div></div>
<div class="modal-overlay" id="note-modal" style="display:none;"><div class="modal"><h3 id="note-modal-title">新建纪事</h3><input type="text" id="note-title-input"><div class="tag-list" style="display:flex;gap:8px;margin-bottom:12px;"><span class="tag-chip selected" data-type="note" style="padding:6px 14px;border-radius:12px;cursor:pointer;background:var(--surface2);">📜 纪事</span><span class="tag-chip" data-type="code" style="padding:6px 14px;border-radius:12px;cursor:pointer;background:var(--surface2);">⌨️ 代码</span></div><textarea id="note-content-input" style="min-height:120px;"></textarea><input type="text" id="note-tags-input" placeholder="标签"><div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button onclick="closeNoteEditor()">取消</button><button class="btn-accent" onclick="saveNote()">保存</button></div></div></div>
<div class="modal-overlay" id="review-modal" style="display:none;"><div class="modal"><h3>夜间复盘 <span id="review-date-label"></span></h3><div><strong>目标</strong><textarea id="review-goal" style="min-height:60px;"></textarea></div><div><strong>经历</strong><textarea id="review-experience" style="min-height:60px;"></textarea></div><div><strong>问题</strong><textarea id="review-problem" style="min-height:60px;"></textarea></div><div><strong>改变</strong><textarea id="review-change" style="min-height:60px;"></textarea></div><div style="margin-top:12px;"><strong>习惯律动：</strong><div id="habit-check-list"></div><button onclick="addHabitPrompt()">＋ 添加习惯</button></div><div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button onclick="closeReviewModal()">取消</button><button class="btn-accent" onclick="saveReview()">铭记复盘</button></div></div></div>
<div class="modal-overlay" id="todo-reminder-modal" style="display:none;"><div class="modal"><h3>设置提醒</h3><input type="datetime-local" id="reminder-datetime"><div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button onclick="closeTodoReminder()">取消</button><button class="btn-accent" onclick="saveTodoReminder()">保存</button></div></div></div>
<div class="modal-overlay" id="schedule-modal" style="display:none;"><div class="modal"><h3>新提示</h3><input type="text" id="schedule-name" placeholder="名称"><select id="schedule-day"><option value="*">每天</option><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="0">周日</option></select><input type="time" id="schedule-time"><div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button onclick="closeScheduleForm()">取消</button><button class="btn-accent" onclick="saveSchedule()">保存</button></div></div></div>
<div class="modal-overlay" id="setup-modal" style="display:none;"><div class="modal"><h3>司辰，请出示密钥</h3><input type="text" id="setup-gist-id" placeholder="Gist ID"><input type="password" id="setup-gist-token" placeholder="GitHub Token"><button class="btn-accent" onclick="saveSetup()" style="margin-top:12px;">同步并归拢</button></div></div>

<script>
(function(){
    // 加载动画
    function initLoadingAnimation() {
        const canvas = document.getElementById('loading-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const quoteEl = document.getElementById('loading-quote-text');
        let w, h, groundY, cx, cy;
        let CENTER_ABOVE_GROUND = 120, QUOTE_BELOW_GROUND = 30;
        let BIG_RADIUS = 80, LINE_WIDTH = 5, GAP = 2 * LINE_WIDTH;
        let OUTER_R, INNER_R, MID_R;
        let SMALL_ARC_DEG = 144, BIG_ARC_GAP_DEG = 90;
        let MAX_RAIN = 110, RAIN_LENGTH_MIN = 18, RAIN_LENGTH_MAX = 40, RAIN_LW_MIN = 0.6, RAIN_LW_MAX = 1.4, SPLASH_R = 1.6;
        function updateParams() {
            const m = window.innerWidth <= 900;
            if (m) { BIG_RADIUS=55; LINE_WIDTH=3.5; CENTER_ABOVE_GROUND=100; QUOTE_BELOW_GROUND=25; MAX_RAIN=70; RAIN_LENGTH_MIN=10; RAIN_LENGTH_MAX=22; RAIN_LW_MIN=0.4; RAIN_LW_MAX=0.8; SPLASH_R=1.2; }
            else { BIG_RADIUS=80; LINE_WIDTH=5; CENTER_ABOVE_GROUND=120; QUOTE_BELOW_GROUND=30; MAX_RAIN=110; RAIN_LENGTH_MIN=18; RAIN_LENGTH_MAX=40; RAIN_LW_MIN=0.6; RAIN_LW_MAX=1.4; SPLASH_R=1.6; }
            GAP=2*LINE_WIDTH; OUTER_R=BIG_RADIUS+GAP/2; INNER_R=BIG_RADIUS-GAP/2; MID_R=BIG_RADIUS;
        }
        let animStart=null; const CYCLE=3500; let smallMid=135, bigGapMid=135;
        class RainDrop {
            constructor(){ this.reset(true); }
            reset(init){ this.x=Math.random()*w; this.y=init?Math.random()*h:-30; this.speed=Math.random()*5+7; this.length=RAIN_LENGTH_MIN+Math.random()*(RAIN_LENGTH_MAX-RAIN_LENGTH_MIN); this.opacity=Math.random()*0.5+0.6; this.lw=RAIN_LW_MIN+Math.random()*(RAIN_LW_MAX-RAIN_LW_MIN); }
            update(){ this.y+=this.speed; if(this.y>groundY){ for(let i=0;i<3;i++) splashes.push(new Splash(this.x,groundY)); this.reset(); } }
            draw(ctx){ ctx.beginPath(); ctx.moveTo(this.x,this.y); ctx.lineTo(this.x+this.length*0.1,this.y-this.length); ctx.strokeStyle=`rgba(232,201,122,${this.opacity})`; ctx.lineWidth=this.lw; ctx.stroke(); }
        }
        class Splash {
            constructor(x,y){ this.x=x; this.y=y; this.vx=(Math.random()-0.5)*2.2; this.vy=-(Math.random()*3+1.8); this.life=1; this.decay=Math.random()*0.03+0.025; }
            update(){ this.life-=this.decay; this.x+=this.vx; this.y+=this.vy; this.vy+=0.08; }
            draw(ctx){ ctx.fillStyle=`rgba(201,169,97,${this.life*0.7})`; ctx.beginPath(); ctx.arc(this.x,this.y,SPLASH_R,0,Math.PI*2); ctx.fill(); }
        }
        const raindrops=[], splashes=[];
        function resize(){ w=canvas.width=canvas.offsetWidth; h=canvas.height=canvas.offsetHeight; updateParams(); if(window.innerWidth<=900) groundY=h*0.68+15; else groundY=h*0.72; cx=w/2; cy=groundY-CENTER_ABOVE_GROUND; quoteEl.style.bottom=(h-groundY-QUOTE_BELOW_GROUND)+'px'; quoteEl.style.top='auto'; raindrops.length=0; for(let i=0;i<MAX_RAIN;i++) raindrops.push(new RainDrop()); }
        window.addEventListener('resize',resize);
        function twoPhaseEase(t){ return t<0.5?2*t*t:1-2*(1-t)*(1-t); }
        function updateAngles(now){ if(!animStart)animStart=now; let elapsed=(now-animStart)%CYCLE; if(elapsed<1000){ let t=twoPhaseEase(elapsed/1000); smallMid=135+t*180; bigGapMid=135; } else if(elapsed<1500){ let t=twoPhaseEase((elapsed-1000)/500); bigGapMid=135-t*180; smallMid=315; } else if(elapsed<2500){ let t=twoPhaseEase((elapsed-1500)/1000); smallMid=315+t*180; bigGapMid=315; } else { let t=twoPhaseEase((elapsed-2500)/1000); bigGapMid=315-t*180; smallMid=495; } smallMid=((smallMid%360)+360)%360; bigGapMid=((bigGapMid%360)+360)%360; }
        function drawArcsAtOrigin(opacity,shadow){ ctx.save(); ctx.lineWidth=LINE_WIDTH; ctx.lineCap='butt'; if(shadow){ ctx.shadowBlur=10; ctx.shadowColor='rgba(201,169,97,0.7)'; } const gs=bigGapMid-BIG_ARC_GAP_DEG/2, ge=bigGapMid+BIG_ARC_GAP_DEG/2; function drawBig(r,c){ ctx.beginPath(); ctx.arc(0,0,r,(ge*Math.PI)/180,((gs+360)*Math.PI)/180); ctx.strokeStyle=c; ctx.stroke(); } drawBig(OUTER_R,`rgba(201,169,97,${opacity})`); drawBig(INNER_R,`rgba(201,169,97,${opacity})`); const half=SMALL_ARC_DEG/2; let ss=smallMid-half, se=smallMid+half; ctx.beginPath(); ctx.arc(0,0,MID_R,(ss*Math.PI)/180,(se*Math.PI)/180); ctx.strokeStyle=`rgba(232,201,122,${opacity})`; ctx.stroke(); ctx.restore(); }
        function drawArcs(opacity=1){ ctx.save(); ctx.translate(cx,cy); drawArcsAtOrigin(opacity,true); ctx.restore(); }
        function drawReflection(){ ctx.save(); ctx.translate(cx,groundY); ctx.scale(1,-0.5); ctx.translate(0,-CENTER_ABOVE_GROUND); ctx.globalAlpha=0.45; drawArcsAtOrigin(0.65,false); ctx.globalAlpha=1; ctx.restore(); }
        function drawGroundLine(){ ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(w,groundY); ctx.strokeStyle='rgba(201,169,97,0.25)'; ctx.lineWidth=0.7; ctx.stroke(); }

    function createGanttProject(){ const n=document.getElementById('new-project-name').value.trim(); if(!n)return; const p={id:genId(),name:n,tasks:[],createdAt:new Date().toISOString()}; appData.ganttProjects.push(p); appData.activeGanttProjectId=p.id; saveData(appData); refreshGanttEditor(); }
    function deleteGanttProject(id){ if(!confirm('删除？'))return; appData.ganttProjects=appData.ganttProjects.filter(p=>p.id!==id); if(appData.activeGanttProjectId===id)appData.activeGanttProjectId=null; saveData(appData); refreshGanttEditor(); }
    function editTask(pid,tid){ const p=appData.ganttProjects.find(p=>p.id===pid); if(!p)return; const t=p.tasks.find(t=>t.id===tid); if(!t)return; document.getElementById('new-task-name').value=t.name; document.getElementById('new-task-start').value=t.startDate; document.getElementById('new-task-end').value=t.endDate; document.getElementById('new-task-progress').value=t.progress; document.getElementById('new-task-color').value=t.color; document.getElementById('task-save-btn').textContent='更新'; document.getElementById('task-cancel-btn').style.display='inline-block'; editingTaskId=tid; editingProjectId=pid; }
    function cancelEditTask(){ document.getElementById('new-task-name').value=''; document.getElementById('new-task-start').value=''; document.getElementById('new-task-end').value=''; document.getElementById('new-task-progress').value='0'; document.getElementById('task-save-btn').textContent='添加'; document.getElementById('task-cancel-btn').style.display='none'; editingTaskId=null; editingProjectId=null; }
    function addTaskToProject(){ const pid=editingProjectId||appData.activeGanttProjectId; if(!pid){toast('先选项目');return;} const p=appData.ganttProjects.find(p=>p.id===pid); if(!p)return; const n=document.getElementById('new-task-name').value.trim(), s=document.getElementById('new-task-start').value, e=document.getElementById('new-task-end').value; const prog=parseInt(document.getElementById('new-task-progress').value)||0, col=document.getElementById('new-task-color').value; if(!n||!s||!e){toast('填完整');return;} if(e<s){toast('日期错误');return;} if(editingTaskId){ const t=p.tasks.find(t=>t.id===editingTaskId); if(t){ t.name=n; t.startDate=s; t.endDate=e; t.progress=Math.min(100,Math.max(0,prog)); t.color=col; } cancelEditTask(); } else { p.tasks.push({id:genId(),name:n,startDate:s,endDate:e,progress:Math.min(100,Math.max(0,prog)),color:col}); document.getElementById('new-task-name').value=''; document.getElementById('new-task-progress').value='0'; } saveData(appData); refreshGanttEditor(); }
    function deleteGanttTask(tid){ const p=appData.ganttProjects.find(p=>p.id===appData.activeGanttProjectId); if(!p)return; p.tasks=p.tasks.filter(t=>t.id!==tid); saveData(appData); refreshGanttEditor(); }
    function renderGanttTasksMini(){ const c=document.getElementById('gantt-tasks-mini-list'); if(!appData.activeGanttProjectId){c.innerHTML='';return;} const p=appData.ganttProjects.find(p=>p.id===appData.activeGanttProjectId); if(!p||!p.tasks.length){c.innerHTML='<div>无任务</div>';return;} c.innerHTML=p.tasks.map(t=>`<div class="gantt-task-mini-item" onclick="editTask('${appData.activeGanttProjectId}','${t.id}')"><span class="task-color-dot" style="background:${t.color};"></span><span>${esc(t.name)}</span><span>${t.progress}%</span><span class="task-del" onclick="event.stopPropagation();deleteGanttTask('${t.id}')">✕</span></div>`).join(''); }
    function loadGanttView(){ const v=document.getElementById('gantt-view-select').value; if(v){ appData.activeGanttProjectId=v; saveData(appData); refreshGanttEditor(); } renderGantt(); }
    function renderGantt(){ const chart=document.getElementById('gantt-chart'), pid=document.getElementById('gantt-view-select').value||appData.activeGanttProjectId; if(!pid){ chart.innerHTML='<div style="padding:40px;color:var(--text3);">请选择项目</div>'; return; } const p=appData.ganttProjects.find(p=>p.id===pid); if(!p||!p.tasks.length){ chart.innerHTML='<div style="padding:40px;color:var(--text3);">无任务</div>'; return; } let min=null,max=null; p.tasks.forEach(t=>{ if(!min||t.startDate<min)min=t.startDate; if(!max||t.endDate>max)max=t.endDate; }); const sD=new Date(min), eD=new Date(max); sD.setDate(sD.getDate()-1); eD.setDate(eD.getDate()+3); const days=[]; for(let d=new Date(sD); d<=eD; d.setDate(d.getDate()+1)) days.push(d.toISOString().split('T')[0]); const today=getToday(), dw=Math.max(28, Math.floor(600/days.length)); let h=`<div class="gantt-header-row"><div class="gantt-header-label"></div><div class="gantt-header-days">`; days.forEach(d=>{ let cls='gantt-day-header'; if([0,6].includes(new Date(d).getDay())) cls+=' weekend'; if(d===today) cls+=' today-col'; h+=`<div class="${cls}" style="min-width:${dw}px;">${parseInt(d.split('-')[2])}</div>`; }); h+='</div></div>'; p.tasks.forEach(t=>{ const ts=new Date(t.startDate), te=new Date(t.endDate), left=Math.max(0,Math.ceil((ts-sD)/86400000))*dw, width=Math.max(1,Math.ceil((te-ts)/86400000)+1)*dw; h+=`<div class="gantt-row"><div class="gantt-label">${esc(t.name)}</div><div class="gantt-timeline" style="min-width:${days.length*dw}px;"><div class="gantt-bar" style="left:${left}px;width:${width}px;background:${t.color};"><div class="progress-fill" style="width:${t.progress}%;"></div><span>${t.progress}%</span><div class="resize-handle"></div></div></div></div>`; }); chart.innerHTML=h; }

    // 主题
    function applyTheme(){ const html=document.documentElement; if(appSettings.theme==='light'){ html.setAttribute('data-theme','light'); document.querySelector('.page-title').textContent='Hypomnema'; } else { html.removeAttribute('data-theme'); document.querySelector('.page-title').textContent='Reverse Chronicle'; } }
    document.getElementById('theme-toggle').addEventListener('click', ()=>{ appSettings.theme=appSettings.theme==='dark'?'light':'dark'; applyTheme(); saveSettings(appSettings); });

    function refreshAllUI(){ renderDatePanel(); renderTodos(); renderProjects3C(); renderNotesList(); renderReviewList(); renderCalendarWidget(); refreshGanttEditor(); renderRightSidebar(); setupReminder(); }

    // 侧栏交互
    const sidebarEl = document.getElementById('sidebar'), mask = document.getElementById('sidebar-mask');
    document.getElementById('hamburger-btn').addEventListener('click', ()=>{ sidebarEl.classList.toggle('open-mobile'); mask.classList.toggle('show'); });
    mask.addEventListener('click', ()=>{ sidebarEl.classList.remove('open-mobile'); mask.classList.remove('show'); });
    const rightSidebar = document.getElementById('right-sidebar'), rightMask = document.getElementById('right-sidebar-mask');
    document.getElementById('reminder-toggle-btn').addEventListener('click', ()=>{ rightSidebar.classList.toggle('collapsed'); rightMask.classList.toggle('show'); if(!rightSidebar.classList.contains('collapsed')) renderRightSidebar(); });
    rightMask.addEventListener('click', ()=>{ rightSidebar.classList.add('collapsed'); rightMask.classList.remove('show'); });
    document.querySelectorAll('.right-sidebar-tab').forEach(tab=>{ tab.addEventListener('click', function(){ document.querySelectorAll('.right-sidebar-tab').forEach(t=>t.classList.remove('active')); this.classList.add('active'); document.querySelectorAll('.right-sidebar-panel').forEach(p=>p.style.display='none'); document.getElementById(this.dataset.rpanel).style.display='block'; }); });
    document.querySelectorAll('.notes-subtab').forEach(tab=>{ tab.addEventListener('click', function(){ document.querySelectorAll('.notes-subtab').forEach(t=>t.classList.remove('active')); this.classList.add('active'); const sub=this.dataset.sub; document.querySelectorAll('#panel-notes .sub-panel').forEach(p=>p.style.display='none'); document.getElementById(sub).style.display='block'; if(sub==='sub-3c') renderProjects3C(); else if(sub==='sub-notes') renderNotesList(); else if(sub==='sub-reviews') renderReviewList(); }); });
    document.querySelectorAll('.sidebar-tab').forEach(tab=>tab.addEventListener('click',function(){ document.querySelectorAll('.sidebar-tab').forEach(t=>t.classList.remove('active')); this.classList.add('active'); document.querySelectorAll('.sidebar-panel').forEach(p=>p.classList.remove('active')); document.getElementById(this.dataset.panel).classList.add('active'); if(this.dataset.panel==='panel-calendar') renderCalendarWidget(); if(this.dataset.panel==='panel-gantt-edit') refreshGanttEditor(); }));

    window.saveSetup = async function(){
        const id=document.getElementById('setup-gist-id').value.trim(), token=document.getElementById('setup-gist-token').value.trim();
        if(!id||!token){ alert('请完整填写司辰密钥'); return; }
        localStorage.setItem('pkm_gist_id', id); localStorage.setItem('pkm_gist_token', token);
        GIST_ID=id; GIST_TOKEN=token;
        document.getElementById('setup-modal').style.display='none';
        startLoadingAnim('sync');
        const cloud=await fetchGist();
        if(cloud){ appData=cloud; saveLocal(appData); toast("时序归拢完毕，司辰。"); }
        else { toast("离线模式，本地手记犹存。"); }
        stopLoading(); applyTheme(); refreshAllUI();
    };

    async function initApp(){
        startLoadingAnim('init');
        if(!GIST_ID||!GIST_TOKEN){ forceHide(); document.getElementById('setup-modal').style.display='flex'; refreshAllUI(); return; }
        startLoadingAnim('sync');
        const cloud=await fetchGist();
        if(cloud){ appData=cloud; saveLocal(appData); toast("时序归拢完毕，司辰。"); }
        else { toast("离线模式，本地手记犹存。"); }
        stopLoading(); applyTheme(); refreshAllUI();
    }

    window.addProject3C=addProject3C; window.deleteProject3C=deleteProject3C; window.openProject3C=openProject3C; window.closeProject3C=closeProject3C; window.saveProject3C=saveProject3C;
    window.openNoteEditor=openNoteEditor; window.closeNoteEditor=closeNoteEditor; window.saveNote=saveNote; window.deleteNote=deleteNote;
    window.addDailyTodo=addDailyTodo; window.toggleDailyTodo=toggleDailyTodo; window.deleteDailyTodo=deleteDailyTodo;
    window.addTodo=addTodo; window.toggleTodo=toggleTodo; window.deleteTodo=deleteTodo;
    window.openTodoReminder=openTodoReminder; window.closeTodoReminder=closeTodoReminder; window.saveTodoReminder=saveTodoReminder;
    window.openReviewModal=openReviewModal; window.closeReviewModal=closeReviewModal; window.addHabitPrompt=addHabitPrompt; window.deleteHabit=deleteHabit; window.saveReview=saveReview;
    window.selectGanttProject=selectGanttProject; window.createGanttProject=createGanttProject; window.deleteGanttProject=deleteGanttProject; window.addTaskToProject=addTaskToProject; window.cancelEditTask=cancelEditTask;
    window.openScheduleForm=openScheduleForm; window.closeScheduleForm=closeScheduleForm; window.saveSchedule=saveSchedule; window.deleteSchedule=deleteSchedule;
    window.navigateCal=navigateCal; window.goToDate=goToDate; window.loadGanttView=loadGanttView;
    initApp();
    setInterval(()=>saveLocal(appData),60000);
})();
</script>
